<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Downloader</title>
<style>
    :root {
        --bg: #0f1115;
        --panel: #181b22;
        --panel-2: #20242e;
        --border: #2a2f3a;
        --text: #f5f6f8;
        --muted: #8a93a3;
        --accent: #4f8cff;
        --accent-hover: #3b78ec;
        --success: #2ecc71;
        --danger: #ff5470;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1c2230 0%, var(--bg) 60%) no-repeat, var(--bg);
        color: var(--text);
        min-height: 100vh;
        display:flex; flex-direction:column;
    }
    .wrap { max-width: 780px; width:100%; margin: 0 auto; padding: 40px 24px 60px; flex:1; }
    header { text-align:center; margin-bottom: 28px; }
    .logo { font-size: 36px; margin-bottom: 6px; }
    h1 { font-size: 26px; font-weight: 700; letter-spacing:-0.01em; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }

    /* The single input + button row */
    .hero {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 6px 30px rgba(0,0,0,.25);
    }
    .input-row { display:flex; gap:10px; }
    .input-row input {
        flex:1;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 14px 16px;
        border-radius: 10px;
        font-size: 15px;
        transition: border-color .15s, background .15s;
    }
    .input-row input:focus {
        outline:none; border-color: var(--accent); background:#262b37;
    }
    .btn {
        background: var(--accent); color:#fff; border:none;
        padding: 14px 22px; border-radius: 10px;
        font-size: 15px; font-weight: 600; cursor: pointer;
        transition: background .15s, transform .05s;
        white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn:disabled { background:#3a4150; cursor:not-allowed; opacity:.7; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); }
    .btn.ghost:hover:not(:disabled) { background: var(--panel-2); }
    .btn.success { background: var(--success); }
    .btn.success:hover:not(:disabled) { background: #28b863; }

    .hint { color: var(--muted); font-size: 12px; margin-top: 10px; text-align:center; }
    .hint kbd { background: var(--panel-2); border:1px solid var(--border); padding: 1px 6px; border-radius:4px; font-size:11px; }

    /* Drop zone visual when dragging */
    .dragging .hero { border-color: var(--accent); background: #1b2230; }

    /* Card */
    .card {
        margin-top: 22px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        animation: fadeIn .25s ease;
    }
    @keyframes fadeIn { from {opacity:0; transform:translateY(6px);} to {opacity:1; transform:none;} }
    .video-head { display:flex; gap:16px; align-items:flex-start; }
    .video-head img {
        width: 140px; height: 80px; object-fit: cover; border-radius:8px; background:#000;
        flex-shrink:0; border:1px solid var(--border);
    }
    .video-meta .title { font-weight:600; font-size:16px; line-height:1.35; margin-bottom:4px; word-break:break-word; }
    .video-meta .info { color: var(--muted); font-size:13px; }

    .quick-row { margin-top: 16px; display:flex; gap:10px; flex-wrap:wrap; }
    .quick-row .btn { flex:1; min-width: 160px; }

    h2 { font-size: 13px; text-transform:uppercase; letter-spacing:.08em; color: var(--muted); margin: 22px 0 10px; font-weight:600; }

    .formats { display:grid; gap:8px; }
    .fmt {
        display:flex; align-items:center; justify-content:space-between;
        background: var(--panel-2);
        border: 1px solid var(--border);
        padding: 12px 14px;
        border-radius: 10px;
        transition: border-color .15s, background .15s;
    }
    .fmt:hover { border-color: var(--accent); }
    .fmt-name { font-weight: 600; font-size: 14px; }
    .fmt-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .fmt .btn { padding: 8px 14px; font-size: 13px; }

    /* Progress overlay */
    .progress-card {
        margin-top: 22px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
    }
    .progress-title { font-size: 14px; color: var(--muted); margin-bottom:10px; }
    .progress-bar-bg { background: var(--panel-2); border-radius: 99px; height: 10px; overflow:hidden; }
    .progress-bar-fg {
        background: linear-gradient(90deg, var(--accent), #6ea8ff);
        height: 100%; width: 0%;
        transition: width .25s ease;
    }
    .progress-stats { display:flex; justify-content:space-between; color: var(--muted); font-size: 12px; margin-top:10px; }

    /* Toast */
    .toast {
        position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
        background: var(--panel); border:1px solid var(--border);
        padding: 12px 18px; border-radius: 10px; font-size: 14px;
        box-shadow: 0 8px 30px rgba(0,0,0,.4);
        opacity: 0; pointer-events:none; transition: opacity .2s, transform .2s;
        max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    .toast.error { border-color: var(--danger); }
    .toast.success { border-color: var(--success); }

    .spin {
        display:inline-block; width:14px; height:14px;
        border: 2px solid rgba(255,255,255,.4); border-top-color:#fff;
        border-radius:50%; animation: spin .7s linear infinite;
        vertical-align:middle; margin-right:6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
        text-align:center; color: var(--muted); font-size: 12px; padding: 16px;
    }

    @media (max-width: 560px) {
        .input-row { flex-direction: column; }
        .video-head { flex-direction: column; }
        .video-head img { width: 100%; height: 160px; }
    }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <div class="logo">🎬</div>
        <h1>Video Downloader</h1>
        <p class="sub">Paste a link from YouTube, Vimeo, TikTok, Instagram, Twitter/X and 1000+ more.</p>
    </header>

    <div class="hero" id="hero">
        <div class="input-row">
            <input id="url" type="text" placeholder="Paste a video link here…" autocomplete="off" spellcheck="false">
            <button class="btn" id="goBtn">Download</button>
        </div>
        <div class="hint">
            Tip: copy a link, then come back here — it auto-pastes. You can also drag &amp; drop a link. Press <kbd>Enter</kbd> to start.
        </div>
    </div>

    <div id="result"></div>
    <div id="progress"></div>
</div>

<div class="toast" id="toast"></div>
<footer>Runs 100% locally on your machine. Files never leave your computer.</footer>

<script>
const $ = (id) => document.getElementById(id);
const urlInput = $('url');
const goBtn = $('go' + 'Btn');
const resultEl = $('result');
const progressEl = $('progress');
const toastEl = $('toast');
const heroEl = $('hero');

let currentUrl = '';
let analyzing = false;

// ---------- Toast ----------
let toastTimer;
function toast(msg, kind='info', ms=3500) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show ' + kind;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = 'toast'; }, ms);
}

// ---------- Helpers ----------
function looksLikeUrl(s) {
    if (!s) return false;
    s = s.trim();
    return /^https?:\/\/\S+\.\S+/i.test(s);
}
function fmtSize(b) {
    if (!b) return '';
    const u = ['B','KB','MB','GB']; let i = 0;
    while (b >= 1024 && i < u.length-1) { b /= 1024; i++; }
    return b.toFixed(b < 10 ? 1 : 0) + ' ' + u[i];
}
function fmtTime(s) {
    if (!s || s <= 0) return '';
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return m + 'm ' + sec.toString().padStart(2,'0') + 's';
}
function fmtSpeed(bps) {
    if (!bps) return '';
    return fmtSize(bps) + '/s';
}
function fmtDuration(s) {
    if (!s) return '';
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
    return (h ? h+':' : '') + (h ? m.toString().padStart(2,'0') : m) + ':' + sec.toString().padStart(2,'0');
}

// ---------- Clipboard auto-paste ----------
async function tryClipboardPaste() {
    if (urlInput.value) return;
    try {
        const text = await navigator.clipboard.readText();
        if (looksLikeUrl(text)) {
            urlInput.value = text.trim();
            toast('Pasted from clipboard ✨', 'success', 1800);
        }
    } catch (e) { /* permission denied — ignore */ }
}
window.addEventListener('focus', tryClipboardPaste);
window.addEventListener('load', () => {
    urlInput.focus();
    setTimeout(tryClipboardPaste, 150);
});

// ---------- Drag & drop URL ----------
['dragenter','dragover'].forEach(ev =>
    window.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.add('dragging'); })
);
['dragleave','drop'].forEach(ev =>
    window.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.remove('dragging'); })
);
window.addEventListener('drop', (e) => {
    const text = e.dataTransfer.getData('text');
    if (looksLikeUrl(text)) {
        urlInput.value = text;
        handleGo();
    }
});

// ---------- Main: analyze, then offer downloads ----------
async function handleGo() {
    const url = urlInput.value.trim();
    if (!url) { toast('Paste a link first', 'error'); urlInput.focus(); return; }
    if (!looksLikeUrl(url)) { toast('That doesn’t look like a link', 'error'); return; }
    if (analyzing) return;

    currentUrl = url;
    analyzing = true;
    goBtn.disabled = true;
    goBtn.innerHTML = '<span class="spin"></span> Reading…';
    resultEl.innerHTML = '';
    progressEl.innerHTML = '';

    try {
        const r = await fetch('/api/analyze', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ url })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Could not read link');
        renderResult(data);
    } catch (e) {
        toast(e.message, 'error', 5000);
    } finally {
        analyzing = false;
        goBtn.disabled = false;
        goBtn.textContent = 'Download';
    }
}

goBtn.addEventListener('click', handleGo);
urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleGo(); });

// ---------- Render formats ----------
function renderResult(d) {
    const thumb = d.thumbnail ? `<img src="${d.thumbnail}" alt="">` : '';
    const dur = d.duration ? ` · ${fmtDuration(d.duration)}` : '';
    const up = d.uploader ? ` · ${escapeHtml(d.uploader)}` : '';

    const vHtml = (d.videoFormats || []).map((f, i) => `
        <div class="fmt">
            <div>
                <div class="fmt-name">${f.resolution} · ${f.format}</div>
                <div class="fmt-sub">${f.bitrate}${f.size ? ' · ' + fmtSize(f.size) : ''}${f.has_audio ? '' : ' · video only (audio will be merged)'}</div>
            </div>
            <button class="btn" data-kind="video" data-q="${f.resolution}">Download</button>
        </div>
    `).join('');

    const aHtml = (d.audioFormats || []).map((f) => `
        <div class="fmt">
            <div>
                <div class="fmt-name">Audio · ${f.format}</div>
                <div class="fmt-sub">${f.bitrate}${f.size ? ' · ' + fmtSize(f.size) : ''}</div>
            </div>
            <button class="btn" data-kind="audio" data-q="${f.format.toLowerCase()}">Download</button>
        </div>
    `).join('');

    resultEl.innerHTML = `
        <div class="card">
            <div class="video-head">
                ${thumb}
                <div class="video-meta">
                    <div class="title">${escapeHtml(d.title)}</div>
                    <div class="info">${escapeHtml(d.platform)}${dur}${up}</div>
                </div>
            </div>

            <div class="quick-row">
                <button class="btn success" data-kind="video" data-q="best">⬇️ Download Best Quality</button>
                <button class="btn ghost" data-kind="audio" data-q="mp3">🎵 Audio Only (MP3)</button>
            </div>

            ${vHtml ? `<h2>Video</h2><div class="formats">${vHtml}</div>` : ''}
            ${aHtml ? `<h2>Audio</h2><div class="formats">${aHtml}</div>` : ''}
        </div>
    `;

    resultEl.querySelectorAll('button[data-kind]').forEach(btn => {
        btn.addEventListener('click', () => startDownload(btn.dataset.kind, btn.dataset.q, btn));
    });
}

function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Download with live progress (SSE) ----------
async function startDownload(kind, quality, triggerBtn) {
    if (triggerBtn) { triggerBtn.disabled = true; }
    progressEl.innerHTML = `
        <div class="progress-card" id="pCard">
            <div class="progress-title"><span class="spin"></span> Preparing download…</div>
            <div class="progress-bar-bg"><div class="progress-bar-fg" id="pBar"></div></div>
            <div class="progress-stats">
                <span id="pPct">0%</span>
                <span id="pSpeed"></span>
                <span id="pEta"></span>
            </div>
        </div>
    `;
    progressEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    let jobId;
    try {
        const r = await fetch('/api/start', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ url: currentUrl, quality, type: kind })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Could not start download');
        jobId = data.job_id;
    } catch (e) {
        progressEl.innerHTML = '';
        toast(e.message, 'error', 5000);
        if (triggerBtn) triggerBtn.disabled = false;
        return;
    }

    const es = new EventSource('/api/progress/' + jobId);
    es.onmessage = (ev) => {
        let p;
        try { p = JSON.parse(ev.data); } catch { return; }

        const bar = $('pBar'), pct = $('pPct'), spd = $('pSpeed'), eta = $('pEta');
        const title = document.querySelector('#pCard .progress-title');

        if (p.status === 'downloading') {
            if (title) title.innerHTML = '<span class="spin"></span> Downloading…';
            if (bar) bar.style.width = (p.progress || 0) + '%';
            if (pct) pct.textContent = (p.progress || 0).toFixed(1) + '%';
            if (spd) spd.textContent = fmtSpeed(p.speed);
            if (eta) eta.textContent = p.eta ? 'ETA ' + fmtTime(p.eta) : '';
        } else if (p.status === 'processing') {
            if (title) title.innerHTML = '<span class="spin"></span> Processing (merging audio/video)…';
            if (bar) bar.style.width = '100%';
            if (pct) pct.textContent = '100%';
            if (spd) spd.textContent = '';
            if (eta) eta.textContent = '';
        } else if (p.status === 'ready') {
            es.close();
            if (title) title.textContent = '✅ Ready — saving to your Downloads…';
            // Trigger the browser download
            const a = document.createElement('a');
            a.href = '/api/file/' + jobId;
            a.download = p.filename || '';
            document.body.appendChild(a); a.click(); a.remove();
            toast('Download started! Check your Downloads folder.', 'success', 4000);
            if (triggerBtn) triggerBtn.disabled = false;
            // Clear progress after a moment
            setTimeout(() => { progressEl.innerHTML = ''; }, 4000);
        } else if (p.status === 'error') {
            es.close();
            progressEl.innerHTML = '';
            toast('Download failed: ' + (p.error || 'unknown error'), 'error', 6000);
            if (triggerBtn) triggerBtn.disabled = false;
        }
    };
    es.onerror = () => {
        es.close();
        progressEl.innerHTML = '';
        toast('Lost connection to backend', 'error');
        if (triggerBtn) triggerBtn.disabled = false;
    };
}
</script>
</body>
</html>
